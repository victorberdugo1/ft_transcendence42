services:

  # ── nginx ────────────────────────────────────────────────────────────
  # Montamos la config como bind mount para poder tocar .conf sin rebuild.
  # Ajusta la ruta de la izquierda a donde esté tu nginx.conf real.
  nginx:
    profiles: ["with-nginx"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ── frontend (React/Vite + WASM game) ─────────────────────────────────────
  # Vite dev server con recarga en vivo para React/JS/CSS.
  # API y WS se enrutan al backend mediante proxy en vite.config.js.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./frontend/app/public:/app/public:ro
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - app-network
    restart: unless-stopped

  # ── backend (Node.js) ────────────────────────────────────────────────
  # nodemon reemplaza el arranque normal: vigila /app/src con inotify
  # internamente y reinicia el proceso Node al detectar cambios.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npx nodemon --watch src --ext js,ts,json src/index.js
    env_file:
      - .env
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src

  # ── db ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"   # expuesto para poder conectar un cliente SQL desde el host en dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  app-network:
    driver: bridge
