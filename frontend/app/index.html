<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Enuma Fighter</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
        /* Evita que el navegador haga scroll, pull-to-refresh o zoom con el
           dedo por encima del juego. Esto es lo que realmente debe frenar
           los gestos por defecto, no forzar los listeners a passive. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        touch-action: none;
      }
    </style>
    <script>
      // ── Polyfill 1: Element.setCapture() is deprecated.
      // Emscripten's library_html5.js calls it internally on mousedown events.
      // We redirect it to the standard setPointerCapture() API.
      if (typeof Element !== 'undefined' && 'setCapture' in Element.prototype) {
        Element.prototype.setCapture = function () {
          var el = this;
          el.addEventListener('pointerdown', function (e) {
            try { el.setPointerCapture(e.pointerId); } catch (_) {}
          }, { once: true });
        };
        document.releaseCapture = function () {};
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="/game/touch-controls.css">
    <script src="/game/ws-client.js"></script>
    <script src="/game/touch-controls.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
